<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz com ranking</title>
  </head>
  <body>
    <div id="inicio">
      <h2>Quiz</h2>
      <input type="text" id="nome" placeholder="Nome" />
      <button onclick="iniciarQuiz()">Iniciar</button>
    </div>

    <div id="quiz" style="display: none;">
      <h2 id="pergunta"></h2>
      <div id="opcoes"></div>
      <p id="pontuacao"></p>
    </div>

    <div id="resultado" style="display: none;">
      <h2>Resultado</h2>
      <p id="resultadoFinal"></p>

      <h2>Ranking</h2>
      <ul id="ranking"></ul>

      <button onclick="reiniciarQuiz()">Novo quiz</button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
